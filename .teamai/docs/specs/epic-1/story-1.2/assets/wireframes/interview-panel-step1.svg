<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="640" fill="#0A1929"/>

  <!-- Main Window Title Bar -->
  <rect x="0" y="0" width="960" height="48" fill="#1A0F2E"/>
  <text x="20" y="30" fill="#E5E7EB" font-family="Arial" font-size="14">OriginOS</text>
  <circle cx="920" cy="24" r="6" fill="#EF4444"/>

  <!-- Modal Overlay -->
  <rect x="0" y="0" width="960" height="640" fill="#0A1929" opacity="0.6"/>

  <!-- Interview Panel - Step 1 -->
  <rect x="360" y="60" width="580" height="520" rx="12" fill="#1A1F2E"/>

  <!-- Title Bar -->
  <text x="380" y="85" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="bold">访谈</text>
  <text x="880" y="85" fill="#9CA3AF" font-family="Arial" font-size="13">取消</text>
  <circle cx="930" cy="82" r="8" fill="#4B5563"/>
  <line x1="926" y1="86" x2="934" y2="82" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Progress Dots: Step 1 Current -->
  <circle cx="420" cy="120" r="12" fill="#00D9FF"/>
  <line x1="432" y1="120" x2="458" y2="120" stroke="#00D9FF" stroke-width="2"/>
  <circle cx="470" cy="120" r="8" fill="none" stroke="#4B5563" stroke-width="2"/>
  <line x1="478" y1="120" x2="504" y2="120" stroke="#4B5563" stroke-width="2"/>
  <circle cx="512" cy="120" r="8" fill="none" stroke="#4B5563" stroke-width="2"/>
  <text x="540" y="125" fill="#9CA3AF" font-family="Arial" font-size="13">步骤 1 / 3</text>

  <!-- Divider -->
  <line x1="380" y1="150" x2="920" y2="150" stroke="#374151" stroke-width="1"/>

  <!-- Question -->
  <rect x="380" y="180" width="80" height="28" rx="14" fill="none" stroke="#00D9FF" stroke-width="1"/>
  <text x="420" y="200" fill="#00D9FF" font-family="Arial" font-size="12" text-anchor="middle">问题 1/3</text>
  <text x="380" y="240" fill="#E5E7EB" font-family="Arial" font-size="18" font-weight="bold">你的工作领域是什么？</text>

  <!-- Hint -->
  <rect x="380" y="260" width="500" height="40" rx="6" fill="rgba(59, 130, 246, 0.1)"/>
  <text x="390" y="285" fill="#3B82F6" font-family="Arial" font-size="14">ℹ️</text>
  <text x="408" y="285" fill="#9CA3AF" font-family="Arial" font-size="13">提示：例如：互联网产品、软件开发、投资分析、数据分析...</text>

  <!-- Input -->
  <rect x="380" y="320" width="500" height="130" rx="8" fill="#0F141F" stroke="#374151" stroke-width="1"/>
  <text x="395" y="345" fill="#6B7280" font-family="Arial" font-size="13">在此输入你的工作领域描述...</text>

  <!-- Buttons -->
  <rect x="380" y="470" width="140" height="36" rx="8" fill="none" stroke="#374151" opacity="0.4"/>
  <text x="450" y="493" fill="#6B7280" font-family="Arial" font-size="13" text-anchor="middle">上一步</text>
  <rect x="740" y="470" width="140" height="36" rx="8" fill="#00D9FF" opacity="0.5"/>
  <text x="810" y="493" fill="#374151" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">下一步 &gt;</text>

  <!-- Step Preview -->
  <text x="380" y="550" fill="#6B7280" font-family="Arial" font-size="11">步骤概览：</text>
  <circle cx="420" cy="565" r="6" fill="none" stroke="#4B5563" stroke-width="1"/>
  <text x="435" y="569" fill="#9CA3AF" font-family="Arial" font-size="10">工作领域</text>
  <circle cx="500" cy="565" r="6" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.5"/>
  <text x="515" y="569" fill="#6B7280" font-family="Arial" font-size="10">工作模式</text>
  <circle cx="580" cy="565" r="6" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.5"/>
  <text x="595" y="569" fill="#6B7280" font-family="Arial" font-size="10">主要任务</text>
</svg>
