<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="640" fill="#0A1929"/>

  <!-- Window Title Bar -->
  <rect x="0" y="0" width="960" height="48" fill="#1A0F2E"/>
  <text x="20" y="30" fill="#E5E7EB" font-family="Arial" font-size="14">设置</text>
  <circle cx="920" cy="24" r="6" fill="#EF4444"/>

  <!-- Sidebar -->
  <rect x="0" y="48" width="200" height="592" fill="#1E293B"/>
  <line x1="200" y1="48" x2="200" y2="640" stroke="#374151"/>

  <!-- Sidebar Items -->
  <text x="30" y="85" fill="#9CA3AF" font-family="Arial" font-size="14">常规</text>
  <text x="30" y="115" fill="#9CA3AF" font-family="Arial" font-size="14">工作空间</text>
  <text x="30" y="145" fill="#9CA3AF" font-family="Arial" font-size="14">本体</text>
  <text x="30" y="175" fill="#00D9FF" font-family="Arial" font-size="14" font-weight="bold">访谈配置</text>
  <line x1="20" y1="158" x2="20" y2="188" stroke="#00D9FF" stroke-width="2"/>

  <!-- Settings Content -->
  <!-- Interview Config Card -->
  <rect x="240" y="80" width="680" height="480" rx="12" fill="#1F2937"/>
  <text x="260" y="105" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="bold">访谈配置                                   当前</text>

  <!-- Divider -->
  <line x1="240" y1="115" x2="920" y2="115" stroke="#374151"/>

  <!-- Interview Status -->
  <text x="260" y="150" fill="#9CA3AF" font-family="Arial" font-size="14">访谈状态</text>
  rect x="260" y="160" width="100" height="28" rx="14" fill="rgba(245, 158, 11, 0.2)"/>
  <!-- Note: SVG doesn't support rgba properly in fill, using solid -->
  <rect x="260" y="160" width="100" height="28" rx="14" fill="none" stroke="#F59E0B"/>
  <text x="310" y="179" fill="#F59E0B" font-family="Arial" font-size="12" text-anchor="middle">已跳过</text>

  <!-- Restart Section -->
  <text x="260" y="230" fill="#9CA3AF" font-family="Arial" font-size="14">重新启动访谈</text>
  <rect x="260" y="240" width="640" height="160" rx="12" fill="#1F2937"/>
  <!-- Note: Duplicate fill -->
  <rect x="260" y="250" width="620" height="130" rx="8" fill="none" stroke="#374151"/>

  <!-- Description Text -->
  <text x="280" y="280" fill="#E5E7EB" font-family="Arial" font-size="14">再次完成项目访谈，更新你的本体结构</text>
  <text x="280" y="305" fill="#6B7280" font-family="Arial" font-size="12">之前完成的访谈数据将会被保存，你可以随时查看。</text>
  <text x="280" y="325" fill="#6B7280" font-family="Arial" font-size="12">完成后系统将根据你的回答生成初始本体结构。</text>

  <!-- Start Button -->
  <rect x="280" y="340" width="160" height="40" rx="8" fill="#00D9FF" opacity="0.9"/>
  <text x="360" y="365" fill="#0A1929" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">开始访谈</text>

  <!-- Info Box -->
  <rect x="260" y="420" width="640" height="60" rx="8" fill="rgba(59, 130, 246, 0.1)"/>
  <text x="280" y="445" fill="#3B82F6" font-family="Arial" font-size="12">ℹ️</text>
  <text x="300" y="445" fill="#9CA3AF" font-family="Arial" font-size="13">访谈完成后，系统将自动生成你的初始本体结构，</text>
  <text x="280" y="465" fill="#9CA3AF" font-family="Arial" font-size="13">包括至少 1 个领域层和 2-3 个概念对象。</text>

  <!-- UI Labels -->
  <text x="20" y="620" fill="#6B7280" font-family="Arial" font-size="10">图例：</text>
  <rect x="60" y="612" width="12" height="12" fill="none" stroke="#F59E0B"/>
  <text x="78" y="622" fill="#9CA3AF" font-family="Arial" font-size="10">状态标签</text>
  <rect x="150" y="612" width="12" height="12" fill="#00D9FF" opacity="0.9"/>
  <text x="168" y="622" fill="#9CA3AF" font-family="Arial" font-size="10">操作按钮</text>
</svg>
