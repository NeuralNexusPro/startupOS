packages:
  - packages/*
  - packages/perception-plugins/*

# Electron 主进程产物在 dist-electron/ 下，运行时向上解析 node_modules；
# pnpm 默认 isolated 模式不 hoist，导致 zod 等依赖解析失败。
# hoisted 模式平铺依赖，解决 Electron + monorepo 运行期解析问题。
nodeLinker: hoisted

# 安装开发/打包平台和 Windows 发布目标需要的 optional 二进制
# （@next/swc-*、@esbuild/* 等）。缺少当前平台会导致构建工具 postinstall 失败；
# 缺少 win32 会导致 Windows 包内 native runtime 不完整。
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64

overrides:
  '@electron/get': 5.0.0

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  canvas: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  onnxruntime-node: false
  protobufjs: true

ignoredBuiltDependencies:
  - onnxruntime-node
