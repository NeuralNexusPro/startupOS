<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect x="0" y="0" width="960" height="640" fill="#0A1929"/>

  <!-- Main Window Title Bar -->
  <rect x="0" y="0" width="960" height="48" fill="#1A0F2E"/>
  <text x="20" y="30" fill="#E5E7EB" font-family="Arial" font-size="14">OriginOS</text>
  <circle cx="920" cy="24" r="6" fill="#EF4444"/>

  <!-- CUI Placeholder -->
  <rect x="20" y="80" width="620" height="80" rx="8" fill="#1F2937"/>
  <text x="40" y="115" fill="#9CA3AF" font-family="Arial" font-size="12">CUI 对话窗口</text>
  <rect x="30" y="125" width="600" height="25" rx="4" fill="#374151"/>

  <!-- Graph Window Placeholder -->
  <rect x="660" y="80" width="280" height="200" rx="8" fill="#1F2937"/>
  <text x="680" y="105" fill="#9CA3AF" font-family="Arial" font-size="11">本体图谱窗体</text>
  <circle cx="740" cy="140" r="20" fill="none" stroke="#4B5563" stroke-width="1"/>
  <circle cx="800" cy="160" r="15" fill="none" stroke="#4B5563" stroke-width="1"/>
  <circle cx="860" cy="145" r="12" fill="none" stroke="#4B5563" stroke-width="1"/>
  <line x1="760" y1="140" x2="785" y2="160" stroke="#4B5563" stroke-width="1"/>
  <line x1="815" y1="160" x2="848" y2="145" stroke="#4B5563" stroke-width="1"/>

  <!-- Settings Window Placeholder -->
  <rect x="20" y="190" width="620" height="120" rx="8" fill="#1F2937"/>
  <text x="40" y="215" fill="#9CA3AF" font-family="Arial" font-size="12">工作空间编辑器</text>
  <circle cx="50" cy="230" r="4" fill="#4B5563"/>
  <rect x="60" y="220" width="200" height="8" rx="4" fill="#374151"/>
  <rect x="60" y="235" width="150" height="6" rx="3" fill="#374151"/>
  <circle cx="50" cy="260" r="4" fill="#4B5563"/>
  <rect x="60" y="250" width="180" height="6" rx="3" fill="#374151"/>
  <rect x="60" y="263" width="120" height="6" rx="3" fill="#374151"/>
  <circle cx="50" cy="290" r="4" fill="#4B5563"/>
  <rect x="60" y="280" width="160" height="6" rx="3" fill="#374151"/>
  <rect x="60" y="293" width="140" height="6" rx="3" fill="#374151"/>

  <!-- Modal Overlay (Semi-transparent) -->
  <rect x="0" y="0" width="960" height="640" fill="#0A1929" opacity="0.8"/>

  <!-- Welcome Dialog (Modal Panel) -->
  <rect x="200" y="150" width="560" height="380" rx="12" fill="#1A1F2E"/>

  <!-- Logo OriginOS - Neural Network -->
  <defs>
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B794F6"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </radialGradient>
  </defs>
  <circle cx="480" cy="220" r="6" fill="url(#nodeGradient)"/>
  <circle cx="465" cy="230" r="5" fill="url(#nodeGradient)"/>
  <circle cx="495" cy="230" r="5" fill="url(#nodeGradient)"/>
  <circle cx="480" cy="235" r="4" fill="url(#nodeGradient)"/>
  <circle cx="450" cy="240" r="4" fill="url(#nodeGradient)"/>
  <circle cx="510" cy="240" r="4" fill="url(#nodeGradient)"/>
  <line x1="480" y1="226" x2="480" y2="231" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <line x1="468" y1="232" x2="476" y2="227" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <line x1="492" y1="232" x2="484" y2="227" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <line x1="472" y1="234" x2="460" y2="236" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <line x1="488" y1="234" x2="500" y2="236" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>

  <!-- Breathing Animation Circle -->
  <circle cx="480" cy="228" r="25" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.2"/>

  <!-- Title -->
  <text x="480" y="280" fill="#E5E7EB" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">欢迎来到 OriginOS</text>

  <!-- Subtitle -->
  <text x="480" y="305" fill="#9CA3AF" font-family="Arial" font-size="14" text-anchor="middle">AI Native 操作系统，让你的思考和认知具象化为知识资产</text>

  <!-- Bullet Points -->
  <text x="280" y="340" fill="#9CA3AF" font-family="Arial" font-size="13">• 项目访谈快速建模</text>
  <text x="280" y="360" fill="#9CA3AF" font-family="Arial" font-size="13">• 本体图谱可视化</text>
  <text x="280" y="380" fill="#9CA3AF" font-family="Arial" font-size="13">• 自然对话交互</text>

  <!-- Buttons -->
  <!-- Start Button (Primary) -->
  <rect x="240" y="420" width="180" height="40" rx="8" fill="#00D9FF" opacity="0.9"/>
  <text x="330" y="445" fill="#0A1929" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">开始访谈 (5分钟)</text>

  <!-- Skip Button (Secondary) -->
  <rect x="460" y="420" width="120" height="40" rx="8" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="520" y="445" fill="#9CA3AF" font-family="Arial" font-size="13" text-anchor="middle">跳过</text>

  <!-- Later Button (Tertiary) -->
  <text x="480" y="495" fill="#9CA3AF" font-family="Arial" font-size="13" text-anchor="middle">稍后问问</text>
  <!-- Underline for tertiary button -->
  <line x1="460" y1="500" x2="500" y2="500" stroke="#6B7280" stroke-width="1"/>

  <!-- UI Labels -->
  <text x="20" y="620" fill="#6B7280" font-family="Arial" font-size="10">图例：</text>
  <rect x="60" y="612" width="12" height="12" fill="#1A1F2E" stroke="#374151"/>
  <text x="78" y="622" fill="#9CA3AF" font-family="Arial" font-size="10">欢迎面板</text>
  <rect x="150" y="612" width="12" height="12" fill="rgba(10, 25, 41, 0.8)"/>
  <text x="168" y="622" fill="#9CA3AF" font-family="Arial" font-size="10">遮罩</text>
</svg>
