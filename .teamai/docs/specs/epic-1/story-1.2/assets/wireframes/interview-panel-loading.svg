<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="640" fill="#0A1929"/>
  <rect x="0" y="0" width="960" height="48" fill="#1A0F2E"/>
  <text x="20" y="30" fill="#E5E7EB" font-family="Arial" font-size="14">OriginOS</text>
  <circle cx="920" cy="24" r="6" fill="#EF4444"/>
  <rect x="0" y="0" width="960" height="640" fill="#0A1929" opacity="0.6"/>

  <!-- Interview Panel - Loading State -->
  <rect x="360" y="60" width="580" height="520" rx="12" fill="#1A1F2E"/>

  <!-- Loading Spinner -->
  <circle cx="650" cy="260" r="30" fill="none" stroke="#00D9FF" stroke-width="3" stroke-dasharray="18,12" opacity="0.8"/>

  <!-- Loading Text -->
  <text x="650" y="320" fill="#E5E7EB" font-family="Arial" font-size="16" text-anchor="middle">正在生成本体结构...</text>

  <!-- Progress Bar -->
  <rect x="480" y="360" width="340" height="8" rx="4" fill="#1F2937"/>
  <rect x="480" y="360" width="200" height="8" rx="4" fill="#00D9FF"/>
  <text x="650" y="385" fill="#9CA3AF" font-family="Arial" font-size="12" text-anchor="middle">正在分析您的访谈数据...</text>

  <!-- Info Text -->
  <text x="650" y="420" fill="#6B7280" font-family="Arial" font-size="12" text-anchor="middle">这可能需要 3-5 秒</text>

  <!-- Preview of Generated Ontology (placeholder) -->
  <text x="650" y="480" fill="#9CA3AF" font-family="Arial" font-size="12" text-anchor="middle">即将为您生成：</text>
  <text x="650" y="500" fill="#4B5563" font-family="Arial" font-size="10" text-anchor="middle">• 1 个领域层</text>
  <text x="650" y="515" fill="#4B5563" font-family="Arial" font-size="10" text-anchor="middle">• 2-3 个概念对象</text>
  <text x="650" y="530" fill="#4B5563" font-family="Arial" font-size="10" text-anchor="middle">• 对应关系</text>
</svg>
